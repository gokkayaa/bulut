<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Dijital BULUT · Sayı 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Anton&display=swap" rel="stylesheet">
<style>
:root{--tq:#00adb9;--navy:#14264a;--yel:#ffd23f;--bg:#0f1d3a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#1d3566 0%,var(--bg) 70%);color:#fff;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;background:var(--tq)}
.logo{font-family:Anton,sans-serif;font-size:30px;letter-spacing:2px;line-height:1;color:#fff}
.logo small{font-family:Nunito;font-weight:800;font-size:12px;letter-spacing:0;display:block;opacity:.9;margin-top:2px}
.issue{text-align:right;font-weight:800;font-size:12px;line-height:1.3}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 6px 4px;width:100%}
#book-wrap{width:100%;max-width:1600px}
#book{margin:0 auto}
.page{background:#fff;overflow:hidden}
.page img{width:100%;height:100%;display:block;object-fit:cover;user-select:none;-webkit-user-drag:none}
.xbtn{display:flex;align-items:center;gap:6px;background:var(--yel);color:var(--navy);border:none;border-radius:30px;padding:8px 14px 8px 10px;font-family:Nunito;font-weight:900;font-size:14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pulse 2.2s infinite;z-index:5}
.xbtn svg{flex:none}
#xs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:44px;margin:-4px 0 12px}
#xs .xbtn{position:static}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
nav{display:flex;align-items:center;gap:14px;padding:8px 0 8px}
nav button{width:46px;height:46px;border-radius:50%;border:none;background:#fff;color:var(--navy);font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.3)}
nav button:disabled{opacity:.35;cursor:default}
#pno{min-width:110px;text-align:center;font-weight:900;font-size:15px}
.hint{font-size:12px;opacity:.7;font-weight:700;margin-top:-6px;padding-bottom:14px;text-align:center}
#modal{position:fixed;inset:0;background:rgba(5,12,30,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modal.on{display:flex}
.card{width:100%;max-width:640px;background:#fff;color:var(--navy);border-radius:18px;padding:22px 22px 18px;position:relative;max-height:90vh;overflow:auto}
.card h2{font-family:Anton;font-size:30px;letter-spacing:.5px;line-height:1.05}
.card .kg{font-weight:800;font-size:13px;color:var(--tq);margin-top:2px}
.card p{font-weight:700;font-size:15px;line-height:1.5;margin-top:12px}
.soon{display:inline-block;margin-top:14px;background:var(--yel);border-radius:14px;padding:4px 12px;font-weight:900;font-size:13px}
.x{position:absolute;right:12px;top:10px;width:36px;height:36px;border-radius:50%;border:none;background:#eef3f8;color:var(--navy);font-size:20px;font-weight:900;cursor:pointer}
#m-body .lead{font-weight:800;font-size:15px;margin:12px 0 6px} #m-body .lead span{display:block;font-size:12px;color:var(--tq)}
.kg-grp{margin-top:12px} .kg-h{font-weight:900;font-size:15px} .kg-h span{font-weight:700;font-size:11px;color:#8a95a8}
.kg-ws{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:20px;padding:6px 13px;font-family:Nunito;font-weight:900;font-size:15px;cursor:pointer}
.chip.on{background:var(--c);color:#fff}
.drops{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.drop{position:relative;text-align:left;border:2px solid #cfe7ee;background:#f3fbfd;border-radius:16px 16px 16px 4px;padding:9px 10px 9px 38px;font-family:Nunito;color:var(--navy);cursor:pointer}
.drop b{position:absolute;left:9px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--tq);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.drop span{display:block;font-weight:900;font-size:13.5px} .drop small{display:block;font-weight:700;font-size:11.5px;color:#56657c;margin-top:2px;line-height:1.3}
.drop.no{opacity:.45;border-color:#ddd} .drop.ok{border-color:#2fb36a;background:#e9f9ef}
.res{margin-top:10px;font-weight:700;font-size:14px} .res .win{font-family:Anton;font-size:26px;color:#2fb36a} .res .win span{font-family:Nunito;font-size:13px;margin-left:6px}
.res .try{color:#d2463b;font-weight:900} .res .try span{display:block;font-size:12px;opacity:.8}
.ans-h{font-weight:900;font-size:16px;margin:14px 0 6px}
.reveal{display:flex;gap:10px;width:100%;text-align:left;border:2px dashed var(--tq);background:#f3fbfd;border-radius:12px;padding:10px 12px;margin-top:7px;font-family:Nunito;color:var(--navy);cursor:pointer}
.reveal .k{font-weight:900;white-space:nowrap} .reveal .v{font-weight:700;color:#8a95a8} .reveal.open{border-style:solid;background:#e9f9ef} .reveal.open .v{color:var(--navy)}
.soon2{margin-top:14px;display:inline-block;background:var(--yel);border-radius:12px;padding:4px 12px;font-weight:900;font-size:13px}
@media(max-width:520px){.drops{grid-template-columns:1fr}}
.vid{display:block;width:100%;max-height:58vh;background:#000;border-radius:12px;margin-top:12px}
.omu{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.oq{display:grid;grid-template-columns:28px 1fr;gap:4px 8px;align-items:center;border-bottom:1px solid #eef2f6;padding-bottom:8px}
.oq .on{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:900;font-size:12px;display:flex;align-items:center;justify-content:center}
.oq .ob{display:flex;gap:8px} .oq .ob button{flex:1;border:2px solid var(--tq);background:#fff;color:var(--navy);border-radius:12px;padding:8px 6px;font-family:Nunito;font-weight:900;font-size:14px;cursor:pointer}
.oq .ob button.sel{background:var(--tq);color:#fff} .oq .ob button:disabled:not(.sel){opacity:.45}
.oq .orz{grid-column:2;font-size:12.5px;font-weight:700;color:#56657c} .oq .orz b{color:var(--navy)}
.oq .bar{height:8px;background:#ffd9cf;border-radius:6px;overflow:hidden;margin-top:4px} .oq .bar i{display:block;height:100%;background:var(--tq)}
.frm{margin-top:16px;padding:14px;border:2px solid #e3eef3;border-radius:14px;background:#f8fcfd;display:flex;flex-direction:column;gap:9px}
.fh{font-family:Anton;font-size:21px;letter-spacing:.3px;line-height:1.1} .fh span{display:block;font-family:Nunito;font-weight:800;font-size:12px;color:var(--tq);letter-spacing:0}
.frm label{display:flex;flex-direction:column;gap:3px;font-weight:800;font-size:12.5px;color:#56657c}
.frm input,.frm select{font-family:Nunito;font-weight:700;font-size:16px;padding:10px 12px;border:2px solid #cfe2ea;border-radius:10px;background:#fff;color:var(--navy)}
.frm .file input{padding:8px;font-size:14px}
.frm2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.frm button[type=submit]{border:none;border-radius:12px;background:var(--tq);color:#fff;font-family:Nunito;font-weight:900;font-size:16px;padding:12px;cursor:pointer}
.frm button:disabled{opacity:.6}
.hint2{font-weight:700;font-size:13px;color:#56657c;margin:0}
.st{font-weight:800;font-size:13.5px;min-height:18px} .st.good{color:#1f9a5a} .st.bad{color:#d2463b}
.pg{display:none;height:10px;background:#e3eef3;border-radius:6px;overflow:hidden} .pg i{display:block;height:100%;width:0;background:var(--tq);transition:width .2s}
.rts2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rts2 button{border:2px solid var(--tq);background:#fff;color:var(--navy);border-radius:12px;padding:12px 8px;font-family:Nunito;font-weight:900;font-size:15px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.rts2 button.sel{background:var(--tq);color:#fff} .rts2 button:disabled:not(.sel){opacity:.6} .rts2 small{font-size:13px}
#zoom{position:fixed;inset:0;background:#0b1530;z-index:60;display:none;touch-action:none}
#zoom.on{display:block}
#zstage{position:absolute;inset:0;overflow:hidden}
#zimg{position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;max-width:none;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
#zbar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(20,38,74,.92);padding:8px 10px;border-radius:30px;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#zbar button{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:var(--navy);font-size:22px;font-weight:900;cursor:pointer}
#zbar #zclose{background:var(--yel)}
#zno{min-width:58px;text-align:center;font-weight:900;font-size:14px}
#zhint{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:rgba(20,38,74,.85);padding:6px 14px;border-radius:16px;font-size:12.5px;font-weight:800;transition:opacity .6s}
nav button svg{display:block;margin:auto}
footer{text-align:center;font-size:11px;font-weight:700;opacity:.6;padding:0 12px 14px}
</style>
</head>
<body>
<header>
  <div class="logo">BULUT<small>Dijital BULUT · Санариптик BULUT</small></div>
  <div class="issue">Sayı 1 · Kasım 2026<br>Cengiz Aytmatov Lisesi</div>
</header>
<main>
  <div id="book-wrap"><div id="book"></div></div>
  <nav>
    <button id="prev" aria-label="Önceki sayfa">‹</button>
    <div id="pno">1 / 20</div>
    <button id="next" aria-label="Sonraki sayfa">›</button>
    <button id="tek" aria-label="Tek sayfa / çift sayfa" title="Tek sayfa / çift sayfa"><svg width="22" height="20" viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="2.4"><rect id="tek-ico" x="2" y="2" width="9" height="16" rx="1.5"/><rect x="13" y="2" width="9" height="16" rx="1.5"/></svg></button>
    <button id="zm" aria-label="Büyüt" title="Büyüt"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21M10.5 7.5v6M7.5 10.5h6"/></svg></button>
    <button id="fs" aria-label="Tam ekran" title="Tam ekran"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </nav>
  <div id="xs"></div>
  <div class="hint">Sayfanın köşesinden tutup çevir. Okumak için sayfaya çift dokun.</div>
</main>
<footer>BULUT · Cengiz Aytmatov Lisesi Gazete ve Dergi Kulübü</footer>

<div id="zoom" aria-modal="true" role="dialog">
  <div id="zstage"><img id="zimg" alt=""></div>
  <div id="zbar">
    <button id="zprev" aria-label="Önceki sayfa">‹</button><span id="zno"></span><button id="znext" aria-label="Sonraki sayfa">›</button>
    <button id="zout" aria-label="Küçült">−</button><button id="zin" aria-label="Büyüt">+</button>
    <button id="zclose" aria-label="Kapat">×</button>
  </div>
  <div id="zhint">İki parmakla büyüt · Çift dokun: yakınlaş</div>
</div>
<div id="modal" role="dialog" aria-modal="true"><div class="card">
  <button class="x" aria-label="Kapat">×</button>
  <h2 id="m-t"></h2><div class="kg" id="m-k"></div>
  <p id="m-p"></p><span class="soon" id="m-soon">Yakında! · Жакында!</span>
  <div id="m-body"></div>
</div></div>

<script src="lib/page-flip.browser.js"></script>
<script src="ekstralar.js"></script>
<script>
const N = 20;
// Sayfa ekstraları: sayfa no → [buton yazısı, başlık, kırgızca, açıklama]
const EXTRA = {
  4:  ['Dinle', "Aytmatov'un İzinde", 'Угуп көр', 'Hikâyeyi sesli dinle.'],
  5:  ['Dinle', 'Kulağa Tanıdık Geliyor!', 'Угуп көр', 'Kelimeye dokun, Türkçesini dinle.'],
  8:  ['İzle ve seç', 'O mu, bu mu?', 'Көр жана танда', 'Röportaj videosunu izle. Sonra sen de seç: arkadaşların ne seçmiş, gör!'],
  9:  ['Yaz', 'Söz Sende!', 'Сөз сенде!', 'Balonlara sen yaz, bize gönder.'],
  12: ['Oyna', 'Lezzet Turu', 'Даам туру', 'Türkiye haritasında lezzet turuna çık!'],
  15: ['Galeri', 'Bulutta Bir Hayvan', 'Булуттагы жаныбар', 'Arkadaşlarının bulut fotoğrafları burada.'],
  17: ['Videolar', 'Dağların Hayaleti', 'Тоолордун арбагы', 'Kar leoparı, Anadolu parsı, kangal ve caretta videoları.'],
  18: ['Keşfet', 'Bulut Yolda', 'Булут жолдо', 'Haritada Bulut ile Kar\'ın yolunu izle. Yeni rotayı sen seç!'],
  19: ['Oyna', 'Bilgi Yağmuru', 'Маалымат жамгыры', 'Şaka olan damlayı bul!'],
  20: ['Katıl', 'BULUT Avı', 'BULUT аңчылыгы', 'Gizli sözü yaz, çekilişe katıl. Rotaya oy ver, fotoğrafını gönder!'],
};
const ICON = '<svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 2l2.6 6.4L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.6z" fill="currentColor"/></svg>';
const book = document.getElementById('book');
for (let i = 1; i <= N; i++) {
  const d = document.createElement('div');
  d.className = 'page' + (i % 2 === 0 ? ' even' : '');
  if (i === 1 || i === N) d.dataset.density = 'hard';
  d.innerHTML = `<img src="sayfalar/s${String(i).padStart(2,'0')}.jpg" alt="BULUT sayfa ${i}" loading="${i < 4 ? 'eager' : 'lazy'}">`;
  book.appendChild(d);
}
// kitabı ekran yüksekliğine sığdır
let TEK = false; try { TEK = localStorage.getItem('bulut_tek') === '1'; } catch (e) {}
function fit(){ const avail = window.innerHeight - (document.fullscreenElement || document.webkitFullscreenElement ? 120 : 175); const land = window.innerWidth > 700 && !TEK;
  const w = land ? 2 * avail / 1.4143 : avail / 1.4143;
  document.getElementById('book-wrap').style.maxWidth = Math.max(300, Math.min(1600, w)) + 'px'; }
fit(); window.addEventListener('resize', fit, true);
const pf = new St.PageFlip(book, {
  width: 560, height: 792, size: 'stretch', minWidth: 280, maxWidth: 1400, minHeight: 396, maxHeight: 1980,
  showCover: true, maxShadowOpacity: .45, mobileScrollSupport: true, flippingTime: 700, usePortrait: true
});
pf.loadFromHTML(document.querySelectorAll('#book .page'));
const pno = document.getElementById('pno'), prev = document.getElementById('prev'), next = document.getElementById('next');
function upd() {
  const i = pf.getCurrentPageIndex();
  const orient = pf.getOrientation();
  pno.textContent = (orient === 'landscape' && i > 0 && i < N - 1) ? `${i + 1}–${Math.min(i + 2, N)} / ${N}` : `${i + 1} / ${N}`;
  prev.disabled = i === 0; next.disabled = i >= N - 1;
  history.replaceState(null, '', '#s' + (i + 1));
  const vis = (orient === 'landscape' && i > 0 && i < N - 1) ? [i + 1, i + 2] : [i + 1];
  const xs = document.getElementById('xs'); xs.innerHTML = '';
  vis.filter(v => EXTRA[v]).forEach(v => { const b = document.createElement('button'); b.className = 'xbtn';
    b.innerHTML = ICON + EXTRA[v][0] + ` <small style="opacity:.6">· s.${v}</small>`; b.onclick = () => openExtra(v); xs.appendChild(b); });
}
pf.on('flip', upd); pf.on('changeOrientation', upd);
document.getElementById('fs').onclick = () => {
  const el = document.documentElement, on = document.fullscreenElement || document.webkitFullscreenElement;
  if (on) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
};
['fullscreenchange','webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => { fit(); setTimeout(() => window.dispatchEvent(new Event('resize')), 120); }));
// --- tek / çift sayfa ---
const tekBtn = document.getElementById('tek');
const tekIco = () => { document.getElementById('tek-ico').style.opacity = TEK ? 1 : 1; tekBtn.style.background = TEK ? 'var(--yel)' : '#fff'; tekBtn.title = TEK ? 'Çift sayfa' : 'Tek sayfa'; };
tekIco();
tekBtn.onclick = () => { TEK = !TEK; try { localStorage.setItem('bulut_tek', TEK ? '1' : '0'); } catch (e) {}
  const cur = pf.getCurrentPageIndex(); fit(); tekIco();
  setTimeout(() => { window.dispatchEvent(new Event('resize')); setTimeout(() => { pf.turnToPage(cur); upd(); }, 80); }, 30); };
// --- yakınlaştırma ---
const Z = { el: document.getElementById('zoom'), img: document.getElementById('zimg'), stage: document.getElementById('zstage'), n: 1, s: 1, x: 0, y: 0, fit: 1 };
function zApply() { Z.img.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`; }
function zClamp() {
  const W = innerWidth, H = innerHeight, w = Z.img.naturalWidth * Z.s, h = Z.img.naturalHeight * Z.s;
  Z.x = w <= W ? (W - w) / 2 : Math.min(0, Math.max(W - w, Z.x));
  Z.y = h <= H ? (H - h) / 2 : Math.min(0, Math.max(H - h, Z.y));
}
function zFit() { Z.fit = Math.min((innerWidth - 16) / Z.img.naturalWidth, (innerHeight - 90) / Z.img.naturalHeight); Z.s = Z.fit; Z.x = 0; Z.y = 8; zClamp(); Z.y = Math.max(8, Z.y - 35); zApply(); }
function zAt(ns, cx, cy) { ns = Math.max(Z.fit, Math.min(Z.fit * 5, ns)); Z.x = cx - (cx - Z.x) * ns / Z.s; Z.y = cy - (cy - Z.y) * ns / Z.s; Z.s = ns; zClamp(); zApply(); }
function zLoad(n) {
  Z.n = Math.min(Math.max(n, 1), N); document.getElementById('zno').textContent = Z.n + ' / ' + N;
  const lo = `sayfalar/s${String(Z.n).padStart(2,'0')}.jpg`, hi = `sayfalar_hd/s${String(Z.n).padStart(2,'0')}.jpg`;
  Z.img.onload = () => { if (!Z.img.dataset.sized) { Z.img.dataset.sized = 1; } zFit(); Z.img.onload = null;
    const big = new Image(); big.onload = () => { if (Z.img.dataset.n == Z.n) { const r = big.naturalWidth / Z.img.naturalWidth; Z.img.src = hi; Z.s /= r; Z.fit /= r; zApply(); } }; big.src = hi; };
  Z.img.dataset.n = Z.n; Z.img.src = lo;
}
function zOpen(n) { Z.el.classList.add('on'); zLoad(n); const hn = document.getElementById('zhint'); hn.style.opacity = 1; setTimeout(() => hn.style.opacity = 0, 2500); }
function zClose() { Z.el.classList.remove('on'); }
function visibleLeft() { const i = pf.getCurrentPageIndex(); return i + 1; }
document.getElementById('zm').onclick = () => zOpen(visibleLeft());
document.getElementById('zclose').onclick = zClose;
document.getElementById('zprev').onclick = () => zLoad(Z.n - 1);
document.getElementById('znext').onclick = () => zLoad(Z.n + 1);
document.getElementById('zin').onclick = () => zAt(Z.s * 1.6, innerWidth / 2, innerHeight / 2);
document.getElementById('zout').onclick = () => zAt(Z.s / 1.6, innerWidth / 2, innerHeight / 2);
Z.stage.addEventListener('wheel', e => { e.preventDefault(); zAt(Z.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY); }, { passive: false });
const P = new Map(); let pinch = null, lastTap = 0;
Z.stage.addEventListener('pointerdown', e => { Z.stage.setPointerCapture(e.pointerId); P.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (P.size === 2) { const [a, b] = [...P.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), s: Z.s }; }
  else { const t = Date.now(); if (t - lastTap < 300) { Z.s > Z.fit * 1.2 ? zFit() : zAt(Z.fit * 2.5, e.clientX, e.clientY); lastTap = 0; } else lastTap = t; } });
Z.stage.addEventListener('pointermove', e => { if (!P.has(e.pointerId)) return; const prev = P.get(e.pointerId); P.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (P.size === 2 && pinch) { const [a, b] = [...P.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zAt(pinch.s * d / pinch.d, (a.x + b.x) / 2, (a.y + b.y) / 2); }
  else if (P.size === 1) { Z.x += e.clientX - prev.x; Z.y += e.clientY - prev.y; zClamp(); zApply(); } });
['pointerup', 'pointercancel'].forEach(ev => Z.stage.addEventListener(ev, e => { P.delete(e.pointerId); if (P.size < 2) pinch = null; }));
window.addEventListener('resize', () => { if (Z.el.classList.contains('on')) zFit(); });
// dergide sayfaya çift dokununca büyüt
let bookTap = 0;
document.getElementById('book').addEventListener('pointerup', e => {
  const t = Date.now(); if (t - bookTap < 320) {
    const r = document.getElementById('book').getBoundingClientRect(); const i = pf.getCurrentPageIndex();
    const right = pf.getOrientation() === 'landscape' && i > 0 && e.clientX > r.left + r.width / 2;
    zOpen(right ? i + 2 : i + 1); bookTap = 0; } else bookTap = t; }, true);
prev.onclick = () => pf.flipPrev(); next.onclick = () => pf.flipNext();
document.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') pf.flipPrev(); if (e.key === 'ArrowRight') pf.flipNext(); if (e.key === 'Escape') { closeExtra(); zClose(); } });
// QR bağlantısı: .../bulut/#s5 → 5. sayfa açılır
const m = location.hash.match(/^#s(\d+)/);
if (m) { const t = Math.min(Math.max(+m[1], 1), N) - 1; setTimeout(() => { pf.turnToPage(t); upd(); if (EXTRA[t + 1] && /x$/.test(location.hash)) openExtra(t + 1); }, 50); } else upd();
const modal = document.getElementById('modal');
function openExtra(i) {
  const x = EXTRA[i], fn = (window.BULUT_EXTRA || {})[i], body = document.getElementById('m-body');
  document.getElementById('m-t').textContent = x[1]; document.getElementById('m-k').textContent = x[2];
  document.getElementById('m-p').textContent = fn ? '' : x[3];
  document.getElementById('m-p').style.display = fn ? 'none' : '';
  document.getElementById('m-soon').style.display = fn ? 'none' : '';
  body.innerHTML = ''; if (fn) fn(body);
  modal.classList.add('on'); modal.querySelector('.card').scrollTop = 0;
}
function closeExtra() { modal.classList.remove('on'); if (window.speechSynthesis) speechSynthesis.cancel(); }
modal.addEventListener('click', e => { if (e.target === modal || e.target.classList.contains('x')) closeExtra(); });
</script>
